services:
  app:
    build: .
    container_name: quantscreen-app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - quantscreen-data:/app/data
    restart: unless-stopped

  pipeline:
    build: .
    container_name: quantscreen-pipeline
    command: uvicorn api:app --host 0.0.0.0 --port 8502
    ports:
      - "8502:8502"
    volumes:
      - .:/app
      - quantscreen-data:/app/data
    restart: unless-stopped

volumes:
  quantscreen-data:
